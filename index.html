<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="script.js" defer></script>
<div class="container">
    <h1>TIC TAC TOE MULTI PLAYER</h1>
    <div class="topPanel">
        <div class="xTurn active"><p>X'S TURN</p></div>
        <div class="oTurn"><p>Y'S TURN</p></div>
    </div>

    <table >
        <tr>
            <td id="00"></td>
            <td id="01"></td>
            <td id="02"></td>
        </tr>
        <tr>
            <td id="10"></td>
            <td id="11"></td>
            <td id="12"></td>
        </tr>
        <tr>
            <td id="20"></td>
            <td id="21"></td>
            <td id="22"></td>
        </tr>
    </table>
</div>

</body>
</html>
